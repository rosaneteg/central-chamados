<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Central de Chamados TechLog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout: barra do squad no topo, fila de chamados em grade; dentro do chamado, trilha de 4 etapas e um painel de trabalho grande, legível no projetor. Um único tema claro, nas cores azul e laranja da instituição. */
:root{
  --blue:#004A8D; --blue-2:#0B5FAE; --orange:#F7941D; --orange-soft:#FEF0DF;
  --ink:#16243A; --muted:#5A6577; --paper:#F4F7FB; --card:#FFFFFF; --line:#D5DEEA;
  --ok:#1E8A4C; --ok-soft:#E3F4EA; --bad:#C2321F; --bad-soft:#FBE6E2;
  --display:"Archivo", "Arial Black", Arial, sans-serif;
  --body:"Atkinson Hyperlegible", Arial, sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,.part:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

header.top{background:var(--blue);color:#fff}
header.top .wrap{display:flex;align-items:center;gap:20px;padding-top:14px;padding-bottom:14px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column}
.brand small{font-family:var(--display);font-weight:800;letter-spacing:.12em;font-size:12px;color:#FFD9A8}
.brand b{font-family:var(--display);font-size:24px;font-weight:800}
#topright{display:flex;gap:12px;margin-left:auto;flex-wrap:wrap;align-items:center}
.squads span.lbl{font-size:14px;opacity:.85;margin-right:4px}
.chip{border:2px solid rgba(255,255,255,.5);background:transparent;color:#fff;border-radius:999px;padding:6px 14px;font-weight:700;display:flex;gap:8px;align-items:center}
.chip .c{font-variant-numeric:tabular-nums;background:rgba(255,255,255,.18);border-radius:999px;padding:0 8px;font-size:15px}
.chip[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:#1b1206}
.chip[aria-pressed="true"] .c{background:rgba(0,0,0,.12)}
.stripe{height:6px;background:var(--orange)}

main{padding:24px 0 48px}
.progress{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:22px}
.progress b{font-family:var(--display);white-space:nowrap}
.bar{flex:1;height:18px;background:#E8EEF6;border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),#FFB55C);width:0;transition:width .5s}
.progress .pct{font-family:var(--display);font-weight:800;color:var(--blue);font-variant-numeric:tabular-nums;min-width:56px;text-align:right}

.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 12px;flex-wrap:wrap}
.sec-head h2{font-size:26px;color:var(--blue)}
.sec-head p{margin:0;color:var(--muted)}
.queue{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.ticket{background:var(--card);border:1px solid var(--line);border-left:8px solid var(--orange);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;text-align:left;color:inherit;transition:transform .15s, box-shadow .15s}
.ticket:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,74,141,.12)}
.ticket .num{font-family:var(--display);font-weight:800;color:var(--blue);font-size:15px;letter-spacing:.06em}
.ticket h3{font-size:21px}
.ticket .who{color:var(--muted);font-size:15px}
.ticket q{font-style:italic}
.pill{align-self:flex-start;font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--orange-soft);color:#8A4B00}
.ticket.done{border-left-color:var(--ok);opacity:.85}
.ticket.done .pill{background:var(--ok-soft);color:var(--ok)}
.ticket.vip{border-left-color:var(--bad);background:linear-gradient(180deg,#fff,#FFF6F3)}
.ticket.vip .pill{background:var(--bad-soft);color:var(--bad)}
.foot-tools{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px;align-items:center;color:var(--muted);font-size:15px}
.linkbtn{background:none;border:none;color:var(--blue);text-decoration:underline;padding:0}

/* run */
.run-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.back{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;color:var(--blue);font-weight:700}
.run-head h2{font-size:26px;color:var(--blue)}
.run-head .coins{margin-left:auto;font-family:var(--display);font-weight:800;background:var(--orange-soft);color:#8A4B00;border-radius:999px;padding:6px 16px;font-variant-numeric:tabular-nums}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px;list-style:none;padding:0}
.steps li{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:center;font-weight:700;color:var(--muted)}
.steps li .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#E8EEF6;font-family:var(--display);flex:none}
.steps li.on{border-color:var(--blue);color:var(--blue);box-shadow:inset 0 -4px 0 var(--orange)}
.steps li.on .n{background:var(--blue);color:#fff}
.steps li.past .n{background:var(--ok);color:#fff}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.grid2{display:grid;grid-template-columns:1.1fr .9fr;gap:20px}
.client{display:flex;gap:16px;align-items:flex-start}
.avatar{width:72px;height:72px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:26px;flex:none}
.bubble{background:var(--paper);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:14px 16px;font-size:20px}
.bubble .meta{font-size:14px;color:var(--muted);margin-bottom:4px}
.speak{margin-top:8px;background:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px;color:var(--blue);font-size:15px;display:inline-flex;gap:6px;align-items:center}
.task{font-family:var(--display);font-size:20px;color:var(--blue);margin:0 0 6px}
.hint-line{color:var(--muted);margin:0 0 14px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:14px 16px;color:var(--ink);font-size:18px;display:flex;gap:12px;align-items:flex-start}
.opt:hover:not(:disabled){border-color:var(--blue-2)}
.opt .k{font-family:var(--display);font-weight:800;color:var(--orange);min-width:22px}
.opt.good{border-color:var(--ok);background:var(--ok-soft)}
.opt.meh{border-color:var(--line);background:#F6F7F9;color:var(--muted)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.answer{font-size:15px;margin-top:4px;display:block;color:var(--ink)}
.chat{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.chat .me{align-self:flex-end;background:var(--blue);color:#fff;border-radius:16px 16px 4px 16px;padding:10px 14px;max-width:85%}
.chat .them{align-self:flex-start;background:var(--paper);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:10px 14px;max-width:85%}
.actions{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px;align-items:center}
.btn{background:var(--blue);color:#fff;border:none;border-radius:12px;padding:14px 22px;font-weight:700;font-size:18px}
.btn:disabled{background:#A9B6C8;cursor:not-allowed}
.btn.alt{background:var(--card);color:var(--blue);border:2px solid var(--blue)}
.btn.orange{background:var(--orange);color:#1b1206}
.hintbox{background:var(--orange-soft);border-left:6px solid var(--orange);border-radius:8px;padding:12px 14px;margin-top:12px}
.feedback{border-radius:10px;padding:12px 14px;margin-top:12px;font-weight:700}
.feedback.good{background:var(--ok-soft);color:var(--ok)}
.feedback.bad{background:var(--bad-soft);color:var(--bad)}
.feedback.meh{background:#F1F3F6;color:var(--muted)}

/* PC */
.pcwrap{overflow-x:auto}
svg.pc{width:100%;min-width:560px;height:auto;display:block}
.part{cursor:pointer}
.part .hit{fill:transparent;stroke:transparent;stroke-width:3;rx:8}
.part:hover .hit{stroke:var(--orange);fill:rgba(247,148,29,.08)}
.part.checked-ok .hit{stroke:var(--ok);fill:rgba(30,138,76,.10)}
.part.checked-bad .hit{stroke:var(--bad);fill:rgba(194,50,31,.14);stroke-width:4}
.tagtext{font-family:var(--body);font-size:13px;font-weight:700;fill:var(--ink)}
.log{display:flex;flex-direction:column;gap:8px;max-height:430px;overflow:auto}
.log .item{border-radius:10px;padding:10px 12px;border:1px solid var(--line)}
.log .item b{display:block}
.log .item.ok{background:var(--ok-soft);border-color:#BFE3CD}
.log .item.bad{background:var(--bad-soft);border-color:#F2C2B8}
.log .item.warn{background:var(--orange-soft);border-color:#F7CF9E}
.empty{color:var(--muted);border:2px dashed var(--line);border-radius:10px;padding:16px}
.found{font-family:var(--display);font-weight:800;color:var(--blue);margin:8px 0 0}

.modal{position:fixed;inset:0;background:rgba(10,25,45,.55);display:grid;place-items:center;padding:16px;z-index:10}
.modal .box{background:var(--card);border-radius:16px;padding:24px;max-width:520px;width:100%}
.modal h3{color:var(--blue);font-size:22px;margin-bottom:8px}

.result{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.stars{font-size:46px;color:var(--orange);letter-spacing:6px;line-height:1}
.score-table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.score-table td{padding:8px 0;border-bottom:1px solid var(--line)}
.score-table td:last-child{text-align:right;font-weight:700}
.score-table tr.total td{font-family:var(--display);font-weight:800;color:var(--blue);font-size:22px;border-bottom:none}
.script{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px}
.script ol{margin:8px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.script li::marker{font-family:var(--display);font-weight:800;color:var(--orange)}

.edit-squads{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.edit-squads input{font:inherit;font-size:16px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;width:150px}

@media (max-width:860px){.grid2,.result{grid-template-columns:1fr}.steps{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.teamtag{display:inline-flex;align-items:center;gap:8px;font-weight:700;background:rgba(255,255,255,.14);border-radius:999px;padding:6px 14px}
.teamtag i{width:18px;height:18px;border-radius:5px;display:inline-block;box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.teamtag.dark{background:var(--paper);color:var(--ink)}
.teamtag.dark i{box-shadow:none}
.coinbox{display:inline-flex;align-items:center;gap:8px;background:#FFD84D;color:#3A2700;border-radius:999px;padding:5px 14px 5px 8px;font-weight:700}
.coinbox b{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.welcome{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center;margin-top:12px}
.welcome h1{font-size:46px;color:var(--blue);margin:6px 0 14px}
.eyebrow{font-family:var(--display);font-weight:800;letter-spacing:.12em;color:var(--orange);margin:0;font-size:15px}
.lead{font-size:20px;color:var(--muted);margin:0}
.colors{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.colorbtn{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--card);border:3px solid var(--line);border-radius:14px;padding:12px 6px;font-weight:700;color:var(--ink)}
.colorbtn i{width:46px;height:46px;border-radius:8px;display:block;box-shadow:0 4px 10px rgba(0,0,0,.12)}
.colorbtn[aria-pressed="true"]{border-color:var(--blue);background:#EAF2FB}
.txt{font:inherit;font-size:18px;width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.small{font-size:15px;color:var(--muted);margin:10px 0 0}
.prof-link{text-align:center;margin-top:36px}
.netinfo{border-radius:10px;padding:10px 14px;margin:0 0 18px;font-size:16px;font-weight:700}
.netinfo.ok{background:var(--ok-soft);color:var(--ok)}
.netinfo.warn{background:var(--orange-soft);color:#8A4B00}
.rules{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-top:24px}
.rules summary{cursor:pointer;font-family:var(--display);font-weight:800;color:var(--blue);font-size:20px;display:flex;align-items:center;gap:10px}
.rules .score-table{max-width:620px}
.score-table td.pos{color:var(--ok)} .score-table td.neg{color:var(--bad)}
.why{display:block;font-size:14px;color:var(--muted)}
.rank{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.rank th{background:var(--blue);color:#fff;padding:10px 8px;font-size:15px;text-align:left}
.rank td{padding:10px 8px;border-bottom:1px solid var(--line);font-size:16px}
.rank td.pos{font-family:var(--display);font-weight:800;color:var(--orange);font-size:20px}
.rank .cellc{text-align:center;color:#A9B6C8}
.rank .cellc.has{color:var(--ink);font-weight:700;background:var(--ok-soft)}
.rank .c{text-align:center;font-weight:700}
.rank .tot{font-family:var(--display);font-size:22px;color:var(--blue)}
.panel .rank{display:table}
.panel{overflow-x:auto}
.btn.danger{background:var(--bad)}
.colorbtn.taken{opacity:.45;cursor:not-allowed}
.emuso{font-size:13px;font-weight:700;color:var(--muted);background:#EEF2F7;border-radius:999px;padding:2px 8px}
.emuso.on{color:var(--ok);background:var(--ok-soft)}
.coresinfo{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.coresinfo:empty{display:none}
.quem{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.quem li{display:flex;align-items:center;gap:8px;font-size:16px}
.quem i{width:16px;height:16px;border-radius:4px;display:inline-block}
.netinfo.bad{background:var(--bad-soft);color:var(--bad)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:860px){.welcome{grid-template-columns:1fr}.colors{grid-template-columns:repeat(3,1fr)}}
</style>
</head>

// ---------- estado local ----------
const store = { get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}, del(k){try{localStorage.removeItem(k)}catch(e){}} };
let ME = store.get("techlog-equipe");          // {equipe, integrantes}
let DONE = store.get("techlog-done") || {};    // chamado -> {coins, pts, fonte}
let PEND = store.get("techlog-pend") || [];    // envios que ainda não chegaram na planilha
let ONLINE = null;                              // null = sem planilha configurada
let R = null, PROF_SENHA = null, timer = null, BLOQ = false;
let DEV = store.get("techlog-dev"); if(!DEV){ DEV = Math.random().toString(36).slice(2)+Date.now().toString(36); store.set("techlog-dev",DEV); }
const save = ()=>{ store.set("techlog-done",DONE); store.set("techlog-pend",PEND); };
const $ = (s,el=document)=>el.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const equipeCor = id => (EQUIPES.find(e=>e.id===id)||{cor:"#999"}).cor;
const totalEquipe = ()=>Object.values(DONE).reduce((a,d)=>a+d.coins,0);


function speak(text){
  try{ const u=new SpeechSynthesisUtterance(text); u.lang="pt-BR"; u.rate=.95; speechSynthesis.cancel(); speechSynthesis.speak(u);}catch(e){}
}
const speakIcon = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>';


// ---------- planilha ----------
async function apiGet(params){
  const u = CONFIG.SCRIPT_URL + "?" + new URLSearchParams(params).toString();
  const r = await fetch(u); return r.json();
}
async function apiPost(body){
  const r = await fetch(CONFIG.SCRIPT_URL,{method:"POST",body:JSON.stringify(body)}); return r.json();
}
async function enviarPendentes(){
  if(!CONFIG.SCRIPT_URL || !PEND.length) return;
  const resto=[];
  for(const p of PEND){
    try{ const r=await apiPost({...p,dispositivo:DEV}); if(r.ok){ BLOQ=false; } else if(r.erro==="ocupada"){ BLOQ=true; } else if(r.erro!=="dados") resto.push(p); ONLINE=true; }
    catch(e){ resto.push(p); ONLINE=false; }
  }
  PEND=resto; save();
}
async function sincronizar(){
  if(!CONFIG.SCRIPT_URL || !ME) return;
  await enviarPendentes();
  try{
    const r = await apiGet({acao:"equipe",equipe:ME.equipe});
    if(r.ok){
      ONLINE=true;
      const novo={};
      r.resultados.forEach(x=>{ novo[x.chamado]={coins:x.coins,pts:x.pts,fonte:x.fonte}; });
      PEND.forEach(p=>{ if(!novo[p.chamado]) novo[p.chamado]={coins:p.total,pts:p.pts,fonte:p.fonte}; });
      DONE=novo; save();
    }
  }catch(e){ ONLINE=false; }
}

// ---------- chamado ----------
function start(id){
  const t=T.find(x=>x.id===id);
  R={t,treino:!!DONE[id],step:0,asked:[],checks:[],found:[],fonteAberta:false,fixIdx:0,fixTries:0,fixed:[],pts:{perguntas:0,inspecao:0,conserto:0,explicacao:0},explic:null,hint:false};
  renderRun();
}
const total=()=>Object.values(R.pts).reduce((a,b)=>a+b,0);
function renderRun(){
  topbar();
  const labels=["Atender o cliente","Inspecionar o PC","Consertar","Explicar ao cliente"];
  const steps = R.step<4 ? `<ol class="steps">${labels.map((l,i)=>`<li class="${i===R.step?'on':''} ${i<R.step?'past':''}"><span class="n">${i<R.step?'✓':i+1}</span>${l}</li>`).join("")}</ol>` : "";
  $("#app").innerHTML = `
   <div class="run-head"><button class="back" id="back">← Voltar à fila</button>
     <h2>${R.t.vip?'Chamado VIP':'Chamado Nº '+R.t.id} · ${esc(R.t.cliente)}</h2>
     <span class="coins" title="TechCoins ganhos neste chamado">${R.treino?'Treino: não vale TechCoins':`Neste chamado: ${total()} TechCoins`}</span></div>
   ${steps}<div id="stage"></div>`;
  $("#back").onclick=()=>{ if(R.step<4) modal(`<h3>Sair do chamado?</h3><p>O atendimento deste chamado será perdido.</p><div class="actions"><button class="btn alt" data-close>Continuar atendendo</button><button class="btn" id="leave">Sair</button></div>`,()=>{$("#leave").onclick=()=>{closeModal();telaFila();};}); else telaFila(); };
  [stepAtender,stepInspecionar,stepConsertar,stepExplicar,stepFim][R.step]();
}
async function finish(){
  R.step=4;
  if(!R.treino){
    const tot=total();
    DONE[R.t.id]={coins:tot,pts:{...R.pts},fonte:R.fonteAberta};
    const envio={acao:"registrar",equipe:ME.equipe,integrantes:ME.integrantes,chamado:R.t.id,pts:{...R.pts},fonte:R.fonteAberta,total:tot};
    PEND.push(envio); save();
    R.envio="enviando";
    renderRun();
    if(CONFIG.SCRIPT_URL){ await enviarPendentes(); R.envio = PEND.length?"falhou":"ok"; } else R.envio="local";
    if(R && R.step===4) renderRun();
  } else renderRun();
}

    <rect x="152" y="70" width="16" height="10" rx="1" fill="#E8EEF6"/><rect x="152" y="86" width="16" height="10" rx="1" fill="#E8EEF6"/>

function stepInspecionar(){
  const need=R.t.defeitos.length, found=R.found.length;
  $("#stage").innerHTML = `<div class="panel grid2">
    <div><p class="task">Clique nas partes para inspecionar</p>
      <p class="hint-line">Lembre o que o cliente contou: <i>“${esc(R.t.relato)}”</i></p>
      <div class="pcwrap">${pcSVG()}</div></div>
    <div><p class="task">Anotações da inspeção</p>
      <div class="log">${R.checks.length?R.checks.map(k=>{
        if(k==="fonte") return R.fonteAberta?`<div class="item bad"><b>Abriram a fonte!</b>Nunca abra a fonte: ela guarda energia mesmo desligada e pode dar choque. −10 TechCoins</div>`:`<div class="item warn"><b>Fonte (por fora)</b>${R.t.defeitos.includes("forca")?'A ventoinha da fonte nem gira. Ela não está recebendo energia.':'A ventoinha da fonte gira normalmente.'}</div>`;
        const bad=R.t.defeitos.includes(k);
        return `<div class="item ${bad?'bad':'ok'}"><b>${PARTS[k].nome}</b>${bad?BAD[k]:PARTS[k].ok}</div>`}).join(""):'<div class="empty">Nenhuma parte inspecionada ainda. Comece pelo que faz mais sentido com o relato do cliente.</div>'}</div>
      <p class="found">Problemas encontrados: ${found} de ${need}</p>
      ${hintBlock(R.t.dica)}
      <div class="actions">${R.hint?'':'<button class="btn alt" id="dica">Pedir uma dica</button>'}<button class="btn" id="next" ${found<need?'disabled':''}>Ir para o conserto →</button></div>
    </div></div>`;
  document.querySelectorAll(".part").forEach(g=>{
    const go=()=>inspect(g.dataset.part);
    g.onclick=go; g.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go();}};
  });
  bindHint();
  $("#next").onclick=()=>{
    const extra=Math.max(0,R.checks.filter(k=>k!=="fonte").length-need-2);
    R.pts.inspecao+=Math.max(10,20*need-extra*2);
    R.step=2;R.hint=false;renderRun();
  };
}
function inspect(k){
  if(k==="fonte"){
    modal(`<h3>Fonte de alimentação</h3><p>Como você quer verificar a fonte?</p>
      <div class="opts"><button class="opt" id="fora"><span class="k">A</span><span>Olhar só por fora: a ventoinha gira? o cabo está firme?</span></button>
      <button class="opt" id="abrir"><span class="k">B</span><span>Abrir a fonte com a chave de fenda para ver por dentro</span></button></div>`,()=>{
      $("#fora").onclick=()=>{ if(!R.checks.includes("fonte")) R.checks.push("fonte"); closeModal(); renderRun(); };
      $("#abrir").onclick=()=>{ if(!R.fonteAberta){R.fonteAberta=true;R.pts.inspecao-=10;} if(!R.checks.includes("fonte")) R.checks.push("fonte"); closeModal(); renderRun(); };
    });
    return;
  }
  if(!R.checks.includes(k)) R.checks.push(k);
  if(R.t.defeitos.includes(k)&&!R.found.includes(k)) R.found.push(k);
  renderRun();
}
function stepConsertar(){
  const k=R.t.defeitos[R.fixIdx];
  if(!R.order){ R.order={}; }
  if(!R.order[k]){ const a=[0,1,2]; for(let i=2;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} R.order[k]=a; }
  const fb=R.fb||"";
  $("#stage").innerHTML = `<div class="panel grid2">
    <div><p class="task">${R.t.defeitos.length>1?`Problema ${R.fixIdx+1} de ${R.t.defeitos.length}: `:''}${PARTS[k].nome}</p>
      <div class="item bad" style="border-radius:10px;padding:12px 14px;background:var(--bad-soft);border:1px solid #F2C2B8"><b>O que encontramos:</b> ${BAD[k]}</div>
      <div class="pcwrap" style="margin-top:12px">${pcSVG()}</div></div>
    <div><p class="task">O que o técnico deve fazer?</p>
      <p class="hint-line">Escolha o conserto certo. Lembre: desligue o computador da tomada antes de mexer dentro dele.</p>
      <div class="opts">${R.order[k].map((oi,pos)=>`<button class="opt" data-oi="${oi}"><span class="k">${String.fromCharCode(65+pos)}</span><span>${esc(FIX[k][oi])}</span></button>`).join("")}</div>
      ${fb}
    </div></div>`;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const oi=+b.dataset.oi;
    if(oi===0){
      R.pts.conserto += R.fixTries===0?20:10; R.fixed.push(k); R.fixTries=0; R.fb="";
      R.fixIdx++;
      if(R.fixIdx>=R.t.defeitos.length){ R.step=3; }
      renderRun();
      if(R.step===2){ $("#stage").insertAdjacentHTML("afterbegin",`<div class="feedback good" style="margin:0 0 12px">Consertado! Agora o próximo problema.</div>`); }
    } else {
      R.fixTries++;
      R.fb=`<div class="feedback bad">${k==="cooler"&&oi===1?FIX_FEEDBACK.cooler1:FIX_FEEDBACK.wrong}</div>`;
      renderRun();
    }
  });
}
function stepExplicar(){
  if(!R.exOrder){ const a=[0,1,2]; for(let i=2;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} R.exOrder=a; }
  const ch=R.explic;
  const reac={good:"Ah, agora eu entendi! Muito obrigado(a), vou indicar vocês para todo mundo!",meh:"Hã? Não entendi nada... mas se está funcionando, tudo bem.",bad:"Nossa, que grosseria. Acho que da próxima vez vou procurar outra assistência."};
  $("#stage").innerHTML = `<div class="panel grid2">
    <div>${clientBlock()}
      <div class="feedback good" style="margin-top:16px">O computador está funcionando de novo!</div>
      ${ch!==null?`<div class="chat"><div class="me">${esc(R.t.explic[ch][0])}</div><div class="them">${reac[R.t.explic[ch][1]]}</div></div>`:''}
    </div>
    <div><p class="task">Como explicar para o cliente?</p>
      <p class="hint-line">O cliente não é técnico. Escolha a melhor forma de contar o que aconteceu.</p>
      <div class="opts">${R.exOrder.map((i,pos)=>{const e=R.t.explic[i];const sel=ch===i;return `<button class="opt ${sel?e[1]:''}" data-i="${i}" ${ch!==null?'disabled':''}><span class="k">${String.fromCharCode(65+pos)}</span><span>${esc(e[0])}</span></button>`}).join("")}</div>
      ${ch!==null?`<div class="feedback ${R.t.explic[ch][1]}">${{good:"Explicação clara e educada! +15 TechCoins",meh:"Correto, mas cheio de termos técnicos. O cliente não entendeu. +5 TechCoins",bad:"Grosseiro! Atendimento ruim afasta clientes. −5 TechCoins"}[R.t.explic[ch][1]]}</div>
      <div class="actions"><button class="btn orange" id="next">Ver resultado →</button></div>`:''}
    </div></div>`;
  $("#ouvir").onclick=()=>speak(R.t.relato);
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;R.explic=i;R.pts.explicacao={good:15,meh:5,bad:-5}[R.t.explic[i][1]];speak(R.t.explic[i][0]);renderRun();});
  const n=$("#next"); if(n) n.onclick=()=>{finish();};
}

function stepFim(){
  const tot=total(), n=R.t.defeitos.length, max=10+20*n+20*n+15;
  const st=tot>=max*.85?3:tot>=max*.6?2:1;
  const lc=x=>x.charAt(0).toLowerCase()+x.slice(1);
  const probs=R.t.defeitos.map(k=>lc(PARTS[k].nome)).join(", ");
  const fixes=R.t.defeitos.map(k=>lc(FIX[k][0])).join("; ");
  const env={enviando:"Enviando para a professora...",ok:"✓ Resultado enviado para a professora.",falhou:"Sem internet agora: o resultado será enviado assim que der.",local:"Modo de teste: resultado salvo só neste computador."}[R.envio]||"";
  const linhas=[
    ["Perguntas ao cliente",R.pts.perguntas,"+5 por pergunta útil"],
    ["Inspeção"+(R.fonteAberta?" (abriram a fonte: −10)":""),R.pts.inspecao,"até +20 por defeito encontrado"],
    ["Conserto",R.pts.conserto,"+20 de primeira, +10 na 2ª tentativa"],
    ["Explicação ao cliente",R.pts.explicacao,"+15 clara, +5 técnica, −5 grosseira"]
  ];
  $("#stage").innerHTML = `<div class="panel result">
    <div><p class="task">Chamado resolvido!</p>
      <div class="stars" aria-label="${st} de 3 estrelas">${"★".repeat(st)}<span style="color:#D5DEEA">${"★".repeat(3-st)}</span></div>
      <table class="score-table" style="margin-top:14px">
        ${linhas.map(l=>`<tr><td>${l[0]}<span class="why">${l[2]}</span></td><td>${l[1]>0?'+':''}${l[1]} TechCoins</td></tr>`).join("")}
        <tr class="total"><td>${R.treino?'Treino (não soma)':'Equipe '+esc(ME.equipe)+' ganhou'}</td><td>${tot} TechCoins</td></tr>
      </table>
      ${R.treino?'<p class="small">Este chamado já tinha sido resolvido pela equipe. Treinar de novo ajuda a aprender, mas não muda os TechCoins.</p>':`<p class="netinfo ${R.envio==='ok'?'ok':'warn'}">${env}</p>`}
      <p class="small">Máximo possível neste chamado: ${max} TechCoins.</p></div>
    <div class="script"><p class="task">Relatório para a gerência</p>
      <p class="hint-line" style="margin:0">Cada pessoa da equipe fala uma frase:</p>
      <ol><li><b>O problema era</b> ${esc(probs)}.</li><li><b>O que fizemos foi</b> ${esc(fixes)}.</li><li><b>Uma coisa que aprendi foi...</b> (essa é com vocês!)</li></ol>
      <div class="actions"><button class="btn" id="home">Voltar à fila de chamados</button></div></div>
  </div>`;
  $("#home").onclick=telaFila;
}

// ---------- professora ----------
function pedirSenha(motivo){
  if(!CONFIG.SCRIPT_URL){
    modal(`<h3>Área da professora</h3><p>O placar online ainda não foi configurado (falta a URL da planilha no arquivo). Sem ele, não há senha para conferir.</p>
      <div class="actions"><button class="btn alt" data-close>Fechar</button>${motivo==="trocar"?'<button class="btn" id="limpa">Trocar equipe mesmo assim</button>':''}</div>`,()=>{const b=$("#limpa"); if(b) b.onclick=()=>{closeModal();sairEquipe();};});
    return;
  }
  modal(`<h3>${motivo==="trocar"?'Trocar a equipe deste computador':'Área da professora'}</h3>
    <p>Digite a senha da professora.</p>
    <form id="fs"><label for="senha" class="sr">Senha</label><input id="senha" type="password" class="txt" autocomplete="off">
    <p class="small" id="err" style="color:var(--bad)"></p>
    <div class="actions"><button type="button" class="btn alt" data-close>Cancelar</button><button class="btn" id="ok">Entrar</button></div></form>`,()=>{
    $("#senha").focus();
    $("#fs").onsubmit=async(e)=>{ e.preventDefault(); const s=$("#senha").value; $("#ok").disabled=true; $("#ok").textContent="Conferindo...";
      try{ const r=await apiGet({acao:"painel",senha:s});
        if(r.ok){ closeModal(); if(motivo==="trocar"){ try{ await apiPost({acao:"liberar",senha:s,equipe:ME.equipe}); }catch(e){} sairEquipe(); } else { PROF_SENHA=s; painel(r.resultados,r.reservas||[]); } }
        else { $("#err").textContent="Senha incorreta."; $("#ok").disabled=false; $("#ok").textContent="Entrar"; }
      }catch(err){ $("#err").textContent="Sem conexão com a planilha. Confira a internet."; $("#ok").disabled=false; $("#ok").textContent="Entrar"; }
    };
  });
}
function sairEquipe(){ ME=null; DONE={}; PEND=[]; store.del("techlog-equipe"); save(); telaEntrada(); }

function painel(res,reservas){
  reservas=reservas||[];
  R=null; clearInterval(timer); $("#topright").innerHTML=`<span class="teamtag">Painel da professora</span>`;
  const porEq=EQUIPES.map(e=>{ const rs=res.filter(r=>r.equipe===e.id); return {...e, rs, total:rs.reduce((a,r)=>a+r.coins,0), integ:(rs.find(r=>r.integrantes)||{}).integrantes||""}; });
  const rank=[...porEq].sort((a,b)=>b.total-a.total||b.rs.length-a.rs.length);
  $("#app").innerHTML = `
  <div class="sec-head"><h2>Painel da professora</h2><p>Atualiza sozinho a cada 20 segundos. Só você vê esta tela.</p></div>
  <div class="panel">
    <table class="rank">
      <tr><th>#</th><th>Equipe</th><th>Computador</th><th>Integrantes</th>${T.map(t=>`<th>${t.vip?'VIP':t.id}</th>`).join("")}<th>Resolvidos</th><th>TechCoins</th></tr>
      ${rank.map((e,i)=>`<tr><td class="pos">${i+1}º</td><td><span class="teamtag dark"><i style="background:${e.cor}"></i>${e.id}</span></td><td>${reservas.some(x=>x.equipe===e.id)?`<span class="emuso on">em uso</span> <button class="linkbtn lib" data-eq="${e.id}">liberar</button>`:'<span class="emuso">livre</span>'}</td><td>${esc((reservas.find(x=>x.equipe===e.id)||{}).integrantes||e.integ)}</td>
        ${T.map(t=>{const r=e.rs.find(x=>x.chamado===t.id);return `<td class="cellc ${r?'has':''}">${r?r.coins+(r.fonte?' <span title="Abriram a fonte">⚠</span>':''):'–'}</td>`}).join("")}
        <td class="c">${e.rs.length} de ${T.length}</td><td class="c tot">${e.total}</td></tr>`).join("")}
    </table>
    <p class="small"><b>Liberar</b> solta a cor de um computador (por exemplo, se a equipe trocou de máquina). Os TechCoins da equipe continuam guardados.</p>
    <p class="small">⚠ = a equipe escolheu abrir a fonte (perdeu 10 TechCoins). Os dados completos ficam na aba "Resultados" da sua planilha.</p>
  </div>
  <div class="actions" style="justify-content:space-between">
    <button class="btn alt" id="sair">Sair do painel</button>
    <div style="display:flex;gap:12px;flex-wrap:wrap"><button class="btn alt" id="atual">Atualizar agora</button><button class="btn danger" id="zerar">Zerar o jogo</button></div>
  </div>`;
  $("#sair").onclick=()=>{ PROF_SENHA=null; clearInterval(timer); ME?telaFila():telaEntrada(); };
  $("#atual").onclick=recarregarPainel;
  document.querySelectorAll(".lib").forEach(b=>b.onclick=()=>modal(`<h3>Liberar a cor ${esc(b.dataset.eq)}?</h3><p>O computador que está com essa cor deixa de pontuar por ela, e outro computador poderá entrar como equipe ${esc(b.dataset.eq)}. Os TechCoins já ganhos continuam.</p><div class="actions"><button class="btn alt" data-close>Cancelar</button><button class="btn" id="dolib">Liberar</button></div>`,()=>{
    $("#dolib").onclick=async()=>{ $("#dolib").disabled=true; try{ await apiPost({acao:"liberar",senha:PROF_SENHA,equipe:b.dataset.eq}); }catch(e){} closeModal(); recarregarPainel(); };
  }));
  $("#zerar").onclick=()=>modal(`<h3>Zerar o jogo?</h3><p>Todos os TechCoins e chamados resolvidos das 5 equipes serão apagados da planilha. Não dá para desfazer.</p>
    <p>Para confirmar, digite <b>ZERAR</b>:</p><label for="cz" class="sr">Confirmação</label><input id="cz" class="txt" autocomplete="off">
    <div class="actions"><button class="btn alt" data-close>Cancelar</button><button class="btn danger" id="doz" disabled>Zerar tudo</button></div>`,()=>{
      $("#cz").oninput=()=>{$("#doz").disabled=$("#cz").value.trim().toUpperCase()!=="ZERAR";};
      $("#doz").onclick=async()=>{ $("#doz").disabled=true; $("#doz").textContent="Zerando...";
        try{ const r=await apiPost({acao:"zerar",senha:PROF_SENHA}); closeModal(); if(r.ok){ recarregarPainel(); } else modal(`<h3>Não foi possível zerar</h3><p>${esc(r.erro||'')}</p><div class="actions"><button class="btn" data-close>Fechar</button></div>`); }
        catch(e){ closeModal(); modal(`<h3>Sem conexão</h3><p>Não foi possível falar com a planilha.</p><div class="actions"><button class="btn" data-close>Fechar</button></div>`); }
      };
    });
  timer=setInterval(recarregarPainel,20000);
}
async function recarregarPainel(){
  try{ const r=await apiGet({acao:"painel",senha:PROF_SENHA}); if(r.ok) painel(r.resultados,r.reservas||[]); }catch(e){}
}

// ---------- modal ----------
function modal(html,bind){ $("#modal").innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="box">${html}</div></div>`; $("#modal").querySelectorAll("[data-close]").forEach(b=>b.onclick=closeModal); $("#modal .modal").onclick=e=>{if(e.target.classList.contains("modal"))closeModal();}; bind&&bind(); }
function closeModal(){ $("#modal").innerHTML=""; }

// ---------- início ----------
(async function(){
  if(ME){ telaFila(); await sincronizar(); if(!R) telaFila(); }
  else telaEntrada();
})();

</script>
